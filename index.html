) return window.__resources[id];\n    }\n    return path;\n  }\n\n  setupDetailOverlay() {\n    const overlay = document.getElementById(\"od-overlay\");\n    if (!overlay || overlay.__init) return;\n    overlay.__init = true;\n\n    const panel = document.getElementById(\"od-panel\");\n    const vp = document.getElementById(\"od-viewport\");\n    const track = document.getElementById(\"od-track\");\n    const dotsBox = document.getElementById(\"od-dots\");\n    const curEl = document.getElementById(\"od-cur\");\n    const pad = (x) => String(x).padStart(2, \"0\");\n\n    const od = this._od = { index: 0, count: 0 };\n\n    const paint = (animate) => {\n      track.style.transition = animate ? \"transform .42s cubic-bezier(.22,.7,.3,1)\" : \"none\";\n      track.style.transform = \"translateX(\" + (-od.index * 100) + \"%)\";\n      const dots = dotsBox.children;\n      for (let i = 0; i < dots.length; i++) {\n        dots[i].style.width = i === od.index ? \"16px\" : \"5px\";\n        dots[i].style.background = i === od.index ? \"#14150F\" : \"rgba(20,21,15,0.18)\";\n      }\n      curEl.textContent = pad(od.index + 1);\n    };\n    const goTo = (i) => { od.index = Math.max(0, Math.min(od.count - 1, i)); paint(true); };\n    this._odPaint = paint;\n    this._odGoTo = goTo;\n\n    dotsBox.addEventListener(\"click\", (e) => {\n      const i = Array.prototype.indexOf.call(dotsBox.children, e.target);\n      if (i >= 0) goTo(i);\n    });\n\n    // 스와이프\n    let dragging = false, startX = 0, startY = 0, delta = 0, axis = null;\n    const down = (e) => {\n      const p = e.touches ? e.touches[0] : e;\n      dragging = true; axis = null; startX = p.clientX; startY = p.clientY; delta = 0;\n      track.style.transition = \"none\";\n    };\n    const move = (e) => {\n      if (!dragging) return;\n      const p = e.touches ? e.touches[0] : e;\n      const dx = p.clientX - startX, dy = p.clientY - startY;\n      if (axis === null) {\n        if (Math.abs(dx) < 6 && Math.abs(dy) < 6) return;\n        axis = Math.abs(dx) > Math.abs(dy) ? \"x\" : \"y\";\n      }\n      if (axis === \"y\") { dragging = false; paint(true); return; }\n      if (e.cancelable) e.preventDefault();\n      delta = dx;\n      const w = vp.offsetWidth || 1;\n      let pct = (-od.index + dx / w) * 100;\n      if ((od.index === 0 && dx > 0) || (od.index === od.count - 1 && dx < 0)) pct = (-od.index + (dx / w) * 0.35) * 100;\n      track.style.transform = \"translateX(\" + pct + \"%)\";\n    };\n    const up = () => {\n      if (!dragging) return; dragging = false;\n      const w = vp.offsetWidth || 1;\n      const th = Math.min(w * 0.18, 60);\n      let i = od.index;\n      if (delta < -th) i++;\n      if (delta > th) i--;\n      goTo(i);\n    };\n    vp.addEventListener(\"touchstart\", down, { passive: true });\n    vp.addEventListener(\"touchmove\", move, { passive: false });\n    vp.addEventListener(\"touchend\", up);\n    vp.addEventListener(\"mousedown\", down);\n    window.addEventListener(\"mousemove\", move);\n    window.addEventListener(\"mouseup\", up);\n\n    const close = () => this.closeDetail();\n    document.getElementById(\"od-back\").addEventListener(\"click\", close);\n    document.getElementById(\"od-close\").addEventListener(\"click\", close);\n    overlay.addEventListener(\"click\", (e) => { if (e.target === overlay) close(); });\n    window.addEventListener(\"keydown\", (e) => { if (e.key === \"Escape\" && overlay.style.display === \"block\") close(); });\n  }\n\n  openDetail(p) {\n    if (!this._od) this.setupDetailOverlay();\n    const R = (path) => this.resolveSrc(path);\n    const overlay = document.getElementById(\"od-overlay\");\n    const panel = document.getElementById(\"od-panel\");\n    const track = document.getElementById(\"od-track\");\n    const dotsBox = document.getElementById(\"od-dots\");\n    const pad = (x) => String(x).padStart(2, \"0\");\n\n    document.getElementById(\"od-project\").textContent = p.project || \"PROJECT\";\n  => {\n      if (root.__rsInit) return;\n      root.__rsInit = true;\n      const vp = root.querySelector(\".rs-viewport\");\n      const track = root.querySelector(\".rs-track\");\n      const dotsBox = root.querySelector(\".rs-dots\");\n      const counterNum = root.querySelector(\".rs-counter > span\");\n      const counterTot = root.querySelector(\".rs-counter\");\n      const nameEl = root.querySelector(\".rs-name\");\n      const metaEl = root.querySelector(\".rs-meta\");\n      const moreEl = root.querySelector(\".rs-more\");\n      const stripEl = root.querySelector(\".rs-strip\");\n      if (!vp || !track) return;\n\n      const projects = this.refProjects()[root.getAttribute(\"data-ref-slider\")] || [];\n      const real = projects.filter((p) => !p.placeholder);\n      let active = 0;          // index into `real`\n      let index = 0;           // slide index within active project\n      let dragging = false, startX = 0, startY = 0, delta = 0, axis = null;\n      const pad = (x) => String(x).padStart(2, \"0\");\n\n      // ----- 필름스트립 빌드 (가로 스크롤 — 사용자가 직접 넘겨봄) -----\n      stripEl.style.overflowX = \"auto\";\n      const marquee = document.createElement(\"div\");\n      marquee.style.cssText = \"display:flex; gap:8px; width:max-content;\";\n      stripEl.appendChild(marquee);\n\n      let realCursor = 0;\n      const makeCell = (p, myReal) => {\n        const isReal = !p.placeholder;\n        const cell = document.createElement(\"button\");\n        cell.type = \"button\";\n        cell.style.cssText = \"flex:0 0 auto; width:96px; text-align:left; background:none; border:none; padding:0; cursor:\" + (isReal ? \"pointer\" : \"default\") + \"; font-family:inherit;\";\n        const frame = document.createElement(\"div\");\n        frame.style.cssText = \"width:96px; height:72px; border-radius:8px; overflow:hidden; border:1.5px solid transparent; background:#EEEDE5; transition:border-color .2s ease, opacity .2s ease;\";\n        if (isReal) {\n          fram t = (-index + (dx / w) * 0.35) * 100;\n        track.style.transform = \"translateX(\" + pct + \"%)\";\n      };\n      const up = () => {\n        if (!dragging) return; dragging = false;\n        const w = vp.offsetWidth || 1;\n        const th = Math.min(w * 0.18, 60);\n        let i = index;\n        if (delta < -th) i++;\n        if (delta > th) i--;\n        goTo(i);\n      };\n      vp.addEventListener(\"touchstart\", down, { passive: true });\n      vp.addEventListener(\"touchmove\", move, { passive: false });\n      vp.addEventListener(\"touchend\", up);\n      vp.addEventListener(\"mousedown\", down);\n      window.addEventListener(\"mousemove\", move);\n      window.addEventListener(\"mouseup\", up);\n\n      buildStage();\n      paintStrip();\n      paint(false);\n    });\n  }\n  renderVals() {\n    const APPLY_FORM_URL = this.props.applyFormUrl || \"https://tally.so/r/RGgJpK\";\n    const apply = () => {\n      window.open(APPLY_FORM_URL, \"_blank\", \"noopener,noreferrer\");\n    };\n    const goBack = (e) => {\n      if (window.history && window.history.length > 1) {\n        if (e && e.preventDefault) e.preventDefault();\n        window.history.back();\n      }\n    };\n    const timeline = [\n      { date: \"2026.08.03(월)\", title: \"온라인 OT\", desc: \"프로젝트·멘토 소개, 태화동 상권 브리핑이 진행됩니다.\" },\n      { date: \"2026.08.08(토) 09:30–20:00\", title: \"창업캠프 (본캠프)\", desc: \"태화동 라운딩, 멘토링, 사업계획 디벨롭, 발표 및 심사가\\n하루 동안 진행됩니다.\" },\n      { date: \"2026.08.08(토)\", title: \"최종 3팀 선발\", desc: \"캠프 당일 심사를 통해 최종 3팀이 발표·수상합니다.\" },\n    ];\n    const deadline = new Date(2026, 6, 29);\n    const today = new Date(); today.setHours(0, 0, 0, 0);\n    const diffDays = Math.round((deadline - today) / 86400000);\n    const dday = diffDays > 0 ? (\"D-\" + diffDays) : (diffDays === 0 ? \"D-DAY\" : \"마감\");\n    return { apply, goBack, timeline, dday };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
